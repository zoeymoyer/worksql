        </div>
    </div>

<script>
    /* ================= 高度自定义配置区 ================= */
    const CONFIG = {
        totalSteps: 25,     // 自定义总格子数
        columns: 5,         // 一行显示几个格子（建议手机端4-5个）
        player1Start: 0,    // 蓝方初始位置（从0开始）
        player2Start: 0,    // 粉方初始位置（如果要不同起点，可设置为如：CONFIG.totalSteps - 1）
        
        // 自定义每个格子的内容。如果内容少于总步数，会自动循环或留空。
        cellContent: [
            "起点", "亲亲一个", "深情拥抱", "喝一杯水", "对方夸你一句",
            "真心话", "前进2步", "帮对方捶背", "退后1步", "大冒险",
            "做个鬼脸", "暂停一回合", "唱句情歌", "指定对方做一件事", "十指紧扣1分钟",
            "讲个笑话", "互相对视30秒", "前进1步", "发个朋友圈表白", "退回到起点",
            "学猫叫", "给对方倒水", "随便买个小零食", "亲额头", "终点！🎉"
        ]
    };
    /* =================================================== */

    // 游戏状态
    const state = {
        turn: 1, // 1 代表 player1, 2 代表 player2
        p1Pos: CONFIG.player1Start,
        p2Pos: CONFIG.player2Start,
        isAnimating: false
    };

    const container = document.getElementById('game-container');
    let cellElements = [];

    // 初始化棋盘
    function initBoard() {
        const rows = Math.ceil(CONFIG.totalSteps / CONFIG.columns);
        const cellGap = 5; // 间距
        // 动态计算每个格子的百分比尺寸
        const cellW = 100 / CONFIG.columns;
        const cellH = 80; // 固定格子高度像素
        
        container.style.height = `${rows * cellH + (rows + 1) * cellGap}px`;

        for (let i = 0; i < CONFIG.totalSteps; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            // 计算行列 (蛇形布局算法)
            let row = Math.floor(i / CONFIG.columns);
            let col = i % CONFIG.columns;
            // 偶数行从左到右，奇数行从右到左，形成S型折返
            if (row % 2 !== 0) {
                col = CONFIG.columns - 1 - col;
            }

            // 设置绝对定位
            cell.style.width = `calc(${cellW}% - ${cellGap * 2}px)`;
            cell.style.height = `${cellH - cellGap * 2}px`;
            cell.style.left = `calc(${col * cellW}% + ${cellGap}px)`;
            cell.style.top = `${row * cellH + cellGap}px`;

            // 填充文字
            let content = CONFIG.cellContent[i] || `格子 ${i}`;
            cell.innerText = content;

            // 记录坐标用于移动棋子
            cell.dataset.cx = `calc(${col * cellW}% + ${cellW/2}%)`;
            cell.dataset.cy = `${row * cellH + cellH/2}px`;

            container.appendChild(cell);
            cellElements.push(cell);
        }

        // 初始化棋子位置
        updatePlayerPosition(1, state.p1Pos, true);
        updatePlayerPosition(2, state.p2Pos, true);
    }

    // 更新棋子位置
    function updatePlayerPosition(playerNum, posIndex, instant = false) {
        if(posIndex >= CONFIG.totalSteps) posIndex = CONFIG.totalSteps - 1;
        if(posIndex < 0) posIndex = 0;

        const cell = cellElements[posIndex];
        const token = document.getElementById(`player${playerNum}`);
        
        // 为了防止两个棋子在同一个格子时完全重叠，增加一点偏移
        const offsetLeft = playerNum === 1 ? -10 : 10;
        const offsetTop = playerNum === 1 ? -10 : 10;

        token.style.left = `calc(${cell.dataset.cx} - 15px + ${offsetLeft}px)`;
        token.style.top = `calc(${cell.dataset.cy} - 15px + ${offsetTop}px)`;
    }

    // 摇骰子事件
    const diceEl = document.getElementById('dice');
    const rollBtn = document.getElementById('roll-btn');
    const resultText = document.getElementById('dice-result');

    rollBtn.addEventListener('click', rollDice);
    diceEl.addEventListener('click', rollDice);

    function rollDice() {
        if (state.isAnimating) return;
        state.isAnimating = true;
        rollBtn.disabled = true;

        // 添加摇晃动画
        diceEl.classList.add('rolling');
        resultText.innerText = "摇晃中...";
        diceEl.innerText = "🎲";

        setTimeout(() => {
            diceEl.classList.remove('rolling');
            
            // 随机1-6
            const steps = Math.floor(Math.random() * 6) + 1;
            diceEl.innerText = steps;
            resultText.innerText = `掷出了 ${steps} 点！`;

            // 开始移动棋子
            movePlayer(state.turn, steps);

        }, 500); // 等待动画结束
    }

    // 棋子移动逻辑（一步一步走）
    function movePlayer(playerNum, steps) {
        let currentPos = playerNum === 1 ? state.p1Pos : state.p2Pos;
        const targetPos = Math.min(currentPos + steps, CONFIG.totalSteps - 1);
        
        let stepCount = 0;
        const moveInterval = setInterval(() => {
            stepCount++;
            let nextPos = currentPos + stepCount;
            
            updatePlayerPosition(playerNum, nextPos);

            // 到达目标
            if (nextPos === targetPos) {
                clearInterval(moveInterval);
                
                // 更新内部状态
                if (playerNum === 1) state.p1Pos = targetPos;
                else state.p2Pos = targetPos;

                // 检查触发事件
                setTimeout(() => checkCellEvent(playerNum, targetPos), 500);
            }
        }, 400); // 每一格移动耗时
    }

    // 检查格子事件（弹窗提示任务）
    function checkCellEvent(playerNum, posIndex) {
        const text = CONFIG.cellContent[posIndex] || "无事件";
        const playerName = playerNum === 1 ? "蓝方(👦)" : "粉方(👧)";
        
        // 如果文字包含特定关键字可以做特殊处理，这里直接弹窗展示
        document.getElementById('modal-text').innerHTML = `<strong>${playerName}</strong> 停留在了: <br><br> <span style="font-size:1.5rem; color:#ff4d6d;">${text}</span>`;
        document.getElementById('modal').classList.add('show');
    }

    // 关闭弹窗并切换回合
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
        
        // 判断是否到达终点
        let currentPos = state.turn === 1 ? state.p1Pos : state.p2Pos;
        if (currentPos >= CONFIG.totalSteps - 1) {
            const winner = state.turn === 1 ? "蓝方👦" : "粉方👧";
            alert(`🎉 恭喜 ${winner} 到达终点！`);
            // 重置游戏可以在这里实现
            return;
        }

        // 切换回合
        state.turn = state.turn === 1 ? 2 : 1;
        const nextName = state.turn === 1 ? "蓝方 👦" : "粉方 👧";
        document.getElementById('status-text').innerText = `轮到 ${nextName} 掷骰子啦`;
        resultText.innerText = "点击摇骰子";
        diceEl.innerText = "🎲";
        
        state.isAnimating = false;
        rollBtn.disabled = false;
    }

    // 启动游戏
    window.onload = initBoard;
    
    // 监听窗口大小改变，动态调整棋盘和棋子
    window.addEventListener('resize', () => {
        const rows = Math.ceil(CONFIG.totalSteps / CONFIG.columns);
        container.style.height = `${rows * 80 + (rows + 1) * 5}px`;
        // 重新设置每个格子的中心点坐标
        cellElements.forEach((cell, i) => {
            const cellW = 100 / CONFIG.columns;
            const cellH = 80;
            let row = Math.floor(i / CONFIG.columns);
            let col = i % CONFIG.columns;
            if (row % 2 !== 0) col = CONFIG.columns - 1 - col;
            cell.dataset.cx = `calc(${col * cellW}% + ${cellW/2}%)`;
            cell.dataset.cy = `${row * cellH + cellH/2}px`;
        });
        updatePlayerPosition(1, state.p1Pos, true);
        updatePlayerPosition(2, state.p2Pos, true);
    });

</script>

            "女生被公主抱10秒", "给TA舔私处1分钟", "69式30秒", "帮对方脱一件衣服", "女生被挠痒痒忍住不能笑",
            "轻捏对方的胸1次", "叫1声亲老公/亲老婆", "和对方深情接吻30秒", "一起恶搞自拍1张", "女方被男方抱着房内绕一圈",
            "相互拥抱30秒", "挑逗对方下巴调戏5秒", "喝一杯交杯酒", "为对方脱一件衣物", "从头到脚抚摸对方一遍",
            "后退3格并脱一件衣服", "从背后抱住对方随意抚摸30秒", "舔对方耳根到胸口", "手伸进对方裤里随意发挥30秒",
            "脱裤子并打屁股5下"
        ];

        const TOTAL_CELLS = 66;
        const DICE_CHARS = ['⚀','⚁','⚂','⚃','⚄','⚅'];
        
        let board = [];
        let players = [
            { id: 1, name: '男生', pos: 0, color: '#ff4d94' },
            { id: 2, name: '女生', pos: 0, color: '#7048e8' }
        ];
        let currentPlayer = 0;
        let isRolling = false;

        // 初始化游戏
        function initGame() {
            // 洗牌算法抓取66个
            const shuffled = [...RAW_DATA].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, TOTAL_CELLS);
            
            board = [
                { type: 'start', content: '🏁 起点' },
                ...selected.map(item => ({ type: 'normal', content: item })),
                { type: 'end', content: '👑 终点' }
            ];

            players[0].pos = 0;
            players[1].pos = 0;
            currentPlayer = 0;

            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('game-board').classList.remove('hidden');
            document.getElementById('control-panel').classList.remove('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
            
            renderBoard();
            updateTurnUI();
            lucide.createIcons(); // 初始化图标
        }

        // 渲染棋盘DOM
        function renderBoard() {
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';

            board.forEach((cell, idx) => {
                const hasP1 = players[0].pos === idx;
                const hasP2 = players[1].pos === idx;

                let bgClass = 'bg-white/80 shadow-sm border border-rose-100/60';
                let textClass = 'text-gray-600';
                if (cell.type === 'start') { bgClass = 'bg-emerald-500 text-white font-bold shadow-md'; textClass = 'text-white'; }
                if (cell.type === 'end') { bgClass = 'bg-amber-500 text-white font-bold shadow-md'; textClass = 'text-white'; }

                const shortContent = cell.content.length > 14 ? cell.content.substring(0, 12) + '...' : cell.content;

                const cellHtml = `
                    <div class="aspect-square rounded-xl p-1.5 flex flex-col items-center justify-between text-center relative transition-all duration-300 ${bgClass}">
                        <span class="text-[9px] text-gray-400 absolute top-0.5 left-1 font-mono">${idx}</span>
                        <div class="flex-1 flex items-center justify-center px-0.5 mt-2">
                            <p class="text-[10px] leading-tight font-medium ${textClass}">${shortContent}</p>
                        </div>
                        <div class="flex justify-center space-x-1 h-3.5 w-full items-center">
                            ${hasP1 ? `<div class="w-3 h-3 rounded-full border border-white shadow-md chess-bounce" style="background-color: ${players[0].color}"></div>` : ''}
                            ${hasP2 ? `<div class="w-3 h-3 rounded-full border border-white shadow-md chess-bounce" style="background-color: ${players[1].color}"></div>` : ''}
                        </div>
                    </div>
                `;
                boardEl.insertAdjacentHTML('beforeend', cellHtml);
            });
        }

        // 更新当前轮到谁的UI
        function updateTurnUI() {
            const turnEl = document.getElementById('player-turn');
            const p = players[currentPlayer];
            turnEl.innerText = `轮到：${p.name}`;
            turnEl.style.backgroundColor = p.color;
        }

        // 掷骰子动画
        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            
            const diceIcon = document.getElementById('dice-icon');
            const rollBtn = document.getElementById('roll-btn');
            
            diceIcon.classList.add('dice-spin');
            rollBtn.disabled = true;
            rollBtn.classList.add('bg-slate-300');
            document.getElementById('msg-box').innerText = '骰子疯狂旋转中...';

            let count = 0;
            const timer = setInterval(() => {
                const rand = Math.floor(Math.random() * 6) + 1;
                diceIcon.innerText = DICE_CHARS[rand - 1];
                document.getElementById('dice-point').innerText = `POINT: ${rand}`;
                count++;
                
                if (count > 8) {
                    clearInterval(timer);
                    const finalValue = Math.floor(Math.random() * 6) + 1;
                    diceIcon.innerText = DICE_CHARS[finalValue - 1];
                    document.getElementById('dice-point').innerText = `POINT: ${finalValue}`;
                    
                    diceIcon.classList.remove('dice-spin');
                    rollBtn.disabled = false;
                    rollBtn.classList.remove('bg-slate-300');
                    
                    movePlayer(finalValue);
                }
            }, 80);
        }

        // 核心位移与触发判定逻辑
        function movePlayer(steps) {
            let p = players[currentPlayer];
            let targetPos = p.pos + steps;

            if (targetPos >= board.length - 1) {
                targetPos = board.length - 1;
                p.pos = targetPos;
                renderBoard();
                showWinModal(`🎉 恭喜 ${p.name} 率先一步攻克终点！`);
                return;
            }

            const targetContent = board[targetPos].content;
            let logMsg = `${p.name} 掷出 ${steps} 点 → 第 ${targetPos} 格：【${targetContent}】`;

            // 功能格子判断逻辑
            if (targetContent.includes('前进')) {
                const match = targetContent.match(/前进(\d+)格/);
                const num = match ? parseInt(match[1]) : 3;
                targetPos = Math.min(targetPos + num, board.length - 1);
                logMsg += ` 🚀 额外前进 ${num} 格！`;
            } else if (targetContent.includes('后退')) {
                const match = targetContent.match(/后退(\d+)格/);
                const num = match ? parseInt(match[1]) : 2;
                targetPos = Math.max(targetPos - num, 0);
                logMsg += ` 🐌 往后倒退 ${num} 格！`;
            }

            p.pos = targetPos;
            document.getElementById('msg-box').innerText = logMsg;
            
            // 如果加算后到了终点
            if (targetPos >= board.length - 1) {
                showWinModal(`🎉 恭喜 ${p.name} 率先一步攻克终点！`);
                return;
            }

            // 换人
            currentPlayer = currentPlayer === 0 ? 1 : 0;
            renderBoard();
            updateTurnUI();
        }

        function showWinModal(text) {
            document.getElementById('win-msg').innerText = text;
            document.getElementById('win-modal').classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('game-board').classList.add('hidden');
            document.getElementById('control-panel').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('msg-box').innerText = '通过剪刀石头布猜先，胜者首发掷骰子。';
        }

        // 首次加载渲染基础图标
        lucide.createIcons();
    </script>
